name: CS-Loyalty-002 matched amplitude

on:
  workflow_dispatch:
  push:
    branches:
      - research/context-separation-effect-v2
    paths:
      - "kurukshetra/effect_size_followup/**"
      - ".github/workflows/context-separation-effect-v2.yml"
  pull_request:
    branches:
      - research/context-separation-loyalty-v1
    paths:
      - "kurukshetra/effect_size_followup/**"
      - ".github/workflows/context-separation-effect-v2.yml"

permissions:
  contents: read

jobs:
  seed:
    name: Seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]

    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kurukshetra/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r kurukshetra/requirements.txt

      - name: Run matched-amplitude seed
        working-directory: kurukshetra
        run: |
          set -o pipefail
          python effect_size_followup/experiment.py --seed ${{ matrix.seed }} 2>&1 | tee results/effect_size_followup_seed${{ matrix.seed }}.log

      - name: Upload immutable seed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-loyalty-002-seed-${{ matrix.seed }}
          path: |
            kurukshetra/results/effect_size_followup_seed${{ matrix.seed }}.json
            kurukshetra/results/effect_size_followup_seed${{ matrix.seed }}.log
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Frozen aggregate verdict
    runs-on: ubuntu-latest
    needs: seed
    if: always()

    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v6

      - name: Download all seed artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: cs-loyalty-002-seed-*
          path: artifacts

      - name: Apply preregistered aggregate gate
        run: python kurukshetra/effect_size_followup/aggregate.py --input artifacts --output aggregate

      - name: Publish aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: CS-Loyalty-002-aggregate
          path: aggregate/
          retention-days: 30
